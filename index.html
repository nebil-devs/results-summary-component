<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">

    <title>Frontend Mentor | Results summary component</title>
  </head>

  <body>

    <div class="container-1">

      <h3>Your Result</h3>

      <div class="score">
        <p class="raw-score">76</p>
        <p class="out-of">of 100</p>
      </div>

      <h2>Great</h2>

      <p class="description">You scored higher than 65% of the people who have taken these tests.</p>

    </div>

    <div class="container-2">

      <h3>Summary</h3>

      <div class="result reaction">
        <div class="tag">
        <img src="assets/images/icon-reaction.svg" alt="Reaction Symbol">
        <p>Reaction</p>
        </div>
        <p class="score">80 <span class="out-of">/ 100</span></p>
      </div>

      <div class="result memory">
        <div class="tag">
        <img src="assets/images/icon-memory.svg" alt="Memory Symbol">
        <p>Memory</p>
        </div>
        <p class="score">92 <span class="out-of"> / 100</span></p>
      </div>

      <div class="result verbal">
        <div class="tag">
        <img src="assets/images/icon-verbal.svg" alt="Verbal Symbol">
        <p>Verbal</p>
        </div>
        <p class="score">61 <span class="out-of">/ 100</span></p>
      </div>

      <div class="result visual">
        <div class="tag">
        <img src="assets/images/icon-visual.svg" alt="Visual Symbol">
        <p>Visual</p>
        </div>
        <p class="score">73 <span class="out-of">/ 100</span></p>
      </div>

      <button>Continue</button>

    </div>

  </body>

</html>
